<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>metalfit</title>
<style>
  :root {
    --bg: #fbfbfa; --card: #fff; --ink: #1a1a19; --dim: #6b6b67; --line: #e4e4e0;
    --ok: #1a7f4b; --okbg: #e8f5ee; --warn: #8a5a00; --warnbg: #fdf3e2; --bad: #a33; --badbg: #fbeaea;
    --accent: #2b5fd9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a; --card: #1f1f23; --ink: #ececea; --dim: #9b9b96; --line: #2e2e34;
      --ok: #5fd39a; --okbg: #163022; --warn: #e3b060; --warnbg: #332710; --bad: #ef8a8a; --badbg: #331a1a;
      --accent: #7aa2f7;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 24px; }
  .bar { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 20px; display: flex; gap: 14px; align-items: center;
    flex-wrap: wrap; }
  .bar .who { font-weight: 600; }
  .bar .meta { color: var(--dim); font-size: 13px; }
  .spacer { flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 7px; padding: 7px 13px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.go:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; }
  .card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .row { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .name { font-weight: 600; word-break: break-all; }
  .tag { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; white-space: nowrap;
    font-weight: 600; letter-spacing: .01em; }
  .tag.ok { background: var(--okbg); color: var(--ok); }
  .tag.warn { background: var(--warnbg); color: var(--warn); }
  .tag.bad { background: var(--badbg); color: var(--bad); }
  .facts { color: var(--dim); font-size: 13px; margin-top: 6px; }
  .advice { font-size: 13px; margin-top: 8px; }
  .actions { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
  select { font: inherit; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); }
  code { background: var(--bg); border: 1px solid var(--line); border-radius: 5px;
    padding: 1px 6px; font-size: 13px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .note { color: var(--dim); font-size: 13px; margin-top: 28px; line-height: 1.6; }
  .err { background: var(--badbg); color: var(--bad); border: 1px solid var(--bad);
    border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>metalfit</h1>
  <div class="sub">GGUF models on Apple Silicon — what fits the GPU whole, and one address in front of them.</div>

  <div id="err" class="err" hidden></div>

  <div class="bar">
    <div>
      <div class="who" id="who">nothing loaded</div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="spacer"></div>
    <button id="stop" hidden>stop</button>
    <button id="rescan">rescan</button>
  </div>

  <div id="list"></div>

  <div class="note">
    Point anything OpenAI-compatible at <code id="api">/v1</code> — it stays the same address when you switch
    models. In Open WebUI that is the OpenAI base URL; any API key is accepted.
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const CTX = [8192, 16384, 32768, 65536, 131072, 262144];
let busy = false;

function gb(n) { return n.toFixed(1); }

function badge(m) {
  if (m.max_ctx >= 131072) return ['ok', 'fits whole'];
  if (m.max_ctx > 0) return ['ok', `fits to ${m.max_ctx / 1024}K`];
  return ['bad', 'needs a split'];
}

function render(s) {
  $('#api').textContent = location.origin + '/v1';
  const on = s.loaded;
  $('#who').textContent = s.busy ? s.busy : on ? on.name : 'nothing loaded';
  $('#meta').textContent = on
    ? `-c ${on.n_ctx} · ${on.n_gpu_layers} layers on the GPU · Metal working set ${s.working_set_gib} GiB`
    : `Metal working set ${s.working_set_gib} GiB`;
  $('#stop').hidden = !on;
  $('#stop').disabled = busy;
  $('#rescan').disabled = busy;

  $('#list').innerHTML = '';
  if (!s.models.length) {
    $('#list').innerHTML = '<div class="card">No .gguf files found. Start metalfit with '
      + '<code>--models &lt;folder&gt;</code>.</div>';
    return;
  }
  for (const m of s.models) {
    const [cls, text] = badge(m);
    const live = on && on.path === m.path;
    const card = document.createElement('div');
    card.className = 'card' + (live ? ' on' : '');
    const opts = CTX.filter(c => m.max_ctx === 0 || c <= m.max_ctx);
    if (!opts.length) opts.push(8192);
    card.innerHTML = `
      <div class="row">
        <span class="name">${m.name}</span>
        <span class="tag ${cls}">${text}</span>
        ${live ? '<span class="tag ok">loaded</span>' : ''}
      </div>
      <div class="facts">${m.arch} · ${m.layers} layers · ${gb(m.file_gb)} GB on disk ·
        ${gb(m.hold_gib)} GiB in memory${m.lazy_gb > 0.5 ? ` · ${gb(m.lazy_gb)} GB read from the file` : ''}
        ${m.shards > 1 ? ` · ${m.shards} shards` : ''}</div>
      <div class="advice">${m.advice}</div>
      <div class="actions">
        <select>${opts.map(c => `<option value="${c}"${c === m.suggest_ctx ? ' selected' : ''}>-c ${c}</option>`).join('')}</select>
        <button class="go">${live ? 'reload' : 'load'}</button>
      </div>`;
    const sel = card.querySelector('select'), go = card.querySelector('button');
    go.disabled = busy;
    go.onclick = () => load(m.path, +sel.value);
    $('#list').appendChild(card);
  }
}

async function call(url, body) {
  const r = await fetch(url, body ? {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error?.message || j.error || r.statusText);
  return j;
}

function fail(e) {
  $('#err').hidden = false;
  $('#err').textContent = String(e.message || e);
}

async function load(path, n_ctx) {
  busy = true;
  $('#err').hidden = true;
  $('#who').textContent = 'loading — a large model takes a minute';
  render(await call('/api/status'));
  try {
    render(await call('/api/load', { path, n_ctx }));
  } catch (e) {
    fail(e);
  } finally {
    busy = false;
    render(await call('/api/status'));
  }
}

$('#stop').onclick = async () => { busy = true; try { render(await call('/api/unload', {})); }
  catch (e) { fail(e); } finally { busy = false; render(await call('/api/status')); } };
$('#rescan').onclick = async () => { try { render(await call('/api/rescan')); } catch (e) { fail(e); } };

(async () => {
  try { render(await call('/api/status')); } catch (e) { fail(e); }
  setInterval(async () => { if (!busy) { try { render(await call('/api/status')); } catch {} } }, 4000);
})();
</script>
</body>
</html>
